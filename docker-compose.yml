services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: punch_system
      POSTGRES_USER: punchsys
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punchsys -d punch_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://punchsys:${DB_PASSWORD}@db/punch_system
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
