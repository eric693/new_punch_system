# 此專案已遷移至 https://lin-punch-system.crownai.ink (VPS 自架)
# 此檔案保留僅供參考，不再用於 Render 部署。
# 部署指南：scripts/setup_vps.sh

services:
  - type: web
    name: lin-punch-system
    env: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && (apt-get install -y fonts-wqy-microhei 2>/dev/null || true)
    startCommand: gunicorn app:app -c gunicorn.conf.py --bind 0.0.0.0:$PORT
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MOBILE_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WEBAUTHN_RP_ID
        value: lin-punch-system.crownai.ink
      - key: WEBAUTHN_ORIGIN
        value: https://lin-punch-system.crownai.ink
      - key: RENDER_EXTERNAL_URL
        value: https://lin-punch-system.crownai.ink
      - key: ANTHROPIC_API_KEY
        sync: false
